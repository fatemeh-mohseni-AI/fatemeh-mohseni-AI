<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Fatemeh Mohseni</title>
  <desc id="desc">An elegant Persian-inspired midnight digital garden with geometric arches, delicate botanical details and a software engineering title.</desc>
  <defs>
